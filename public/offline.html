<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#047857" />
    <title>You're offline · KhataLink</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8fafc; color: #0f172a; font: 16px/1.5 system-ui, sans-serif; }
      main { width: min(100%, 420px); padding: 32px; border: 1px solid #e2e8f0; border-radius: 24px; background: white; text-align: center; }
      img { width: 72px; height: 72px; margin-bottom: 16px; }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0 0 24px; color: #475569; }
      button { min-height: 48px; padding: 0 22px; border: 0; border-radius: 12px; background: #047857; color: white; font: inherit; font-weight: 650; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/khatalink-192.png" alt="" />
      <h1>You're offline</h1>
      <p>KhataLink needs an internet connection to securely load your account and shop records. Your ledger data is not stored for offline access.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
